# 기본 테스트: 실제 모델·비밀정보·외부 API 없이 실행 (실제 모델 테스트 -m models는 제외)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # uv.lock은 macOS 전용으로 풀이되어 있으므로(tool.uv.environments) Apple Silicon 러너 사용
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 의존성 설치 (uv.lock 그대로)
        run: uv sync --locked

      - name: 문법 검사 (테스트가 import하지 않는 평가 스크립트 포함)
        run: uv run python -m compileall -q services packages tools

      - name: 린트 (ruff, 설정은 pyproject.toml)
        run: uv run ruff check --output-format=github

      - name: 포맷 검사 (고치려면 uv run ruff format)
        run: uv run ruff format --check

      - name: 타입 검사 (pyright, 범위는 pyproject.toml [tool.pyright])
        run: uv run pyright
        env:
          PYRIGHT_PYTHON_IGNORE_WARNINGS: '1'

      - uses: actions/setup-node@v7
        with:
          node-version-file: services/chatbot/frontend/.nvmrc
          cache: npm
          cache-dependency-path: services/chatbot/frontend/package-lock.json

      - name: 새 화면 의존성 설치 (package-lock.json 그대로)
        working-directory: services/chatbot/frontend
        run: npm ci

      - name: 새 화면 타입 검사 (tsc)
        working-directory: services/chatbot/frontend
        run: npm run typecheck

      - name: 새 화면 단위 테스트 (Vitest)
        working-directory: services/chatbot/frontend
        run: npm test

      - name: 새 화면 빌드 (대역 E2E가 dist를 씀)
        working-directory: services/chatbot/frontend
        run: npm run build

      - name: 브라우저 캐시 (브라우저 E2E e2e_stub용 Chromium)
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Chromium 설치 (playwright 버전은 uv.lock 그대로)
        run: uv run playwright install chromium

      - name: 테스트 (브라우저 E2E 대역 e2e_stub 포함, 실제 모델 e2e_live 제외)
        run: uv run pytest --junitxml=pytest-report.xml

      - name: 테스트 결과 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: |
            pytest-report.xml
            results/e2e_stub/
          if-no-files-found: ignore   # results/e2e_stub/는 e2e_stub가 실패했을 때만 생김 (스크린샷·화면 HTML·프로세스 출력·요청 로그)
