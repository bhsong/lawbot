[project]
name = "law-calendar"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.3",
    "lawbot-common",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
    "uvicorn==0.54.0",
]

[project.scripts]
law-calendar = "law_calendar.server:main"

[tool.uv.sources]
lawbot-common = { path = "../../packages/lawbot-common", editable = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
