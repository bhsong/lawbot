[project]
name = "erp-updates"
version = "0.1.0"
description = "ERP reference items read from monitor's law repository clones; no network access."
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
erp-updates = "erp_updates.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
