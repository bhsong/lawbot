[project]
name = "lawbot-model-server"
version = "0.1.0"
description = "OpenAI 호환 로컬 모델 서버 (FastAPI · MLX · sentence-transformers): chat completions·embeddings·rerank"
authors = [
    { name = "bhsong", email = "sbh3003@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.3",
    "mlx-lm>=0.32.2",
    "numpy>=2.0",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
# 레포 최상위에서 uv run lawbot-model-server
lawbot-model-server = "lawbot_model_server.server:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
