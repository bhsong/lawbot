# uv workspace 루트 (가상 루트: 패키지 없음). 서비스는 services/* (docs/archives/monorepo-openai-api.md)
#   services/chatbot       패키지 lawbot: 웹앱·평가 (uv run lawbot-app)
#   services/model-server  패키지 lawbot_model_server: OpenAI 호환 모델 서버 (uv run lawbot-model-server)
#   services/monitor       패키지 law_monitor: 법령 변경 수집기 (uv run law-monitor, docs/plans/monitor-collector.md)
#   tools/lawbot-tools     패키지 lawbot_tools: 평가·분석 도구 (uv run lawbot-eval-v4). 런타임 lawbot을 import, 반대는 안 됨
#   packages/lawbot-common 패키지 lawbot_common: 서비스 공통 규칙 (.env 파서, 포트 검증). 서비스끼리는 import하지 않고 이것만 같이 씀
# 공통 개발 도구(pytest·ruff)와 설정은 여기에 둔다. uv.lock은 workspace 전체에 하나
[tool.uv.workspace]
members = ["services/*", "packages/*", "tools/*"]

[tool.uv.sources]
lawbot = { workspace = true }
lawbot-model-server = { workspace = true }
law-monitor = { workspace = true }
lawbot-common = { workspace = true }
lawbot-tools = { workspace = true }

[tool.uv]
environments = ["sys_platform == 'darwin'"]   # mlx는 macOS용: 잠금 파일을 macOS 기준으로만 풀이

[dependency-groups]
dev = [
    "lawbot",   # 루트에서 uv sync·uv run 하면 서비스 패키지가 함께 설치됨
    "lawbot-model-server",
    "law-monitor",
    "lawbot-tools",
    "openai>=2.0",   # 모델 서버가 OpenAI SDK로 그대로 쓰이는지 보는 계약 테스트
    "pytest>=9.1.1",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["services/chatbot/tests", "services/model-server/tests", "services/monitor/tests", "packages/lawbot-common/tests"]
addopts = "-ra --strict-markers -m 'not models and not network'"   # 실제 모델·외부 접속 테스트는 -m models / -m network로 따로 실행
filterwarnings = [
    # OpenAI SDK가 TestClient(계약 테스트)에 요청마다 timeout을 넘김: 테스트 대역에서만 나는 경고
    "ignore:You should not use the 'timeout' argument with the TestClient",
]
markers = [
    "models: 실제 모델 파일(models/)과 Apple Silicon이 필요한 테스트",
    "integration: 실제 Gradio 서버를 별도 프로세스로 띄우는 인증 테스트 (127.0.0.1만 접속)",
    "network: 실제 외부 API·git 저장소에 접속하는 테스트 (services/monitor, 기본 실행에서 제외)",
]

[tool.ruff]
line-length = 120   # 포맷터가 줄을 나누는 기준. 줄 길이 검사(E501)는 켜지 않음 (줄 끝 주석이 길어도 됨)
target-version = "py314"
src = ["services/*/src", "services/*/tests", "packages/*/src", "packages/*/tests", "tools/*/src"]   # import 정렬에서 lawbot·tests 모듈(conftest·fakes)을 프로젝트 모듈로 봄
# data_gd/ 등은 .gitignore에 있어 자동으로 건너뜀 (docs/archives/ruff-lint-format.md)

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",   # 한국어 문장의 전각 기호(【】 등)를 헷갈리는 문자로 오탐
    "B905",     # zip(strict=): 동작이 바뀔 수 있어 하나씩 판단해야 함
    "B007",     # for … in ask(...): pass 뒤 마지막 값을 루프 밖에서 씀 → _로 바꾸면 깨짐
    "E741",     # 짧은 컴프리헨션 변수 l
    "E731",     # 짧은 함수·테스트 대역에 lambda 대입
    "RUF005",   # [*a, b] 표기 권장 (취향)
]

[tool.ruff.lint.per-file-ignores]
"{services,packages}/*/tests/**" = [
    "E402",     # 가짜 모듈을 sys.modules에 넣은 뒤 import, 절마다 import
    "RUF012",   # 테스트 대역의 공유 기록용 클래스 속성
    "RUF059",   # 튜플 풀기로 반환 구조를 보여 줌
]

[tool.ruff.format]
quote-style = "single"   # 기존 코드가 작은따옴표
