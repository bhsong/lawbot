[project]
name = "lawbot"
version = "0.1.0"
description = "근로기준법 조문 근거 RAG 챗봇 (튜닝 임베딩 + Qwen3-4B LoRA, MLX 로컬 실행)"
readme = "README.md"
authors = [
    { name = "bhsong", email = "sbh3003@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "gradio>=6.30.0",
    "mlx-lm>=0.32.2",
    "pandas>=3.0.6",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
# uv run lawbot-app / uv run lawbot-eval 로 실행
lawbot-app = "lawbot.app:main"
lawbot-eval = "lawbot.eval_dev:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
environments = ["sys_platform == 'darwin'"]   # mlx는 macOS용: 잠금 파일을 macOS 기준으로만 풀이

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not models'"   # 실제 모델 테스트는 -m models로 따로 실행
markers = [
    "models: 실제 모델 파일(models/)과 Apple Silicon이 필요한 테스트",
    "integration: 실제 Gradio 서버를 별도 프로세스로 띄우는 인증 테스트 (127.0.0.1만 접속)",
]
